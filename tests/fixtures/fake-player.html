<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fake YouTube movie_player</title>
  </head>
  <body>
    <div id="movie_player" class="html5-video-player"></div>
    <script>
      (function () {
        const player = document.getElementById("movie_player");
        let playing = true;
        let currentTime = 12;
        let volume = 42;

        Object.assign(player, {
          getVideoData() {
            return { video_id: "fake123", title: "Fixture Video" };
          },
          getDuration() {
            return 180;
          },
          getCurrentTime() {
            return currentTime;
          },
          getVolume() {
            return volume;
          },
          isMuted() {
            return false;
          },
          getPlaybackQuality() {
            return "hd720";
          },
          getPlayerState() {
            return playing ? 1 : 2;
          },
          playVideo() {
            playing = true;
          },
          pauseVideo() {
            playing = false;
          },
          seekTo(seconds) {
            currentTime = Math.max(0, Math.min(seconds, 180));
          },
          setVolume(value) {
            volume = Math.max(0, Math.min(100, value));
          },
        });

        window.__setPlaying = (value) => {
          playing = value;
        };
        window.__setCurrentTime = (value) => {
          currentTime = value;
        };
        window.__setAdShowing = (value) => {
          player.classList.toggle("ad-showing", value);
        };
        window.__skipClicks = 0;
        window.__skipTrusted = false;
        window.__setSkipButton = (visible) => {
          const existing = player.querySelector(".ytp-skip-ad-button");
          if (existing) existing.remove();
          window.__skipClicks = 0;
          window.__skipTrusted = false;
          if (!visible) return;
          const btn = document.createElement("button");
          btn.className = "ytp-skip-ad-button";
          btn.type = "button";
          btn.textContent = "Skip";
          btn.addEventListener("click", (event) => {
            window.__skipClicks += 1;
            window.__skipTrusted = event.isTrusted;
          });
          player.appendChild(btn);
        };
      })();
    </script>
  </body>
</html>
